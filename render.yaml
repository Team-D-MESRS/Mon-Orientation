# Blueprint Render : https://render.com/docs/blueprint-spec
# L'application lit la variable PORT injectée par Render (défaut 10000) : ne pas la fixer ici.
services:
  - type: web
    name: mon-orientation-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # sync: false seul = Render crée la variable et demande sa valeur une fois,
      # sans jamais l'écraser au push suivant. (value + sync ensemble = rejet du blueprint.)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Liste séparée par des virgules (voir main.ts). Les deux fronts Vercel du projet :
      # « mon-orientation » (compte niyi2) et celui importé par l'équipe.
      - key: CORS_ORIGIN
        value: https://mon-orientation-six.vercel.app,https://frontend-neon-two-70.vercel.app
      # Profil démonstration : EducMaster n'étant pas branché, la garde de educmaster.service.ts
      # refuse EDUCMASTER_MODE=fictif dès que NODE_ENV=production.
      - key: NODE_ENV
        value: preview
      - key: EDUCMASTER_MODE
        value: fictif
      - key: TRUST_PROXY
        value: "true"
      # Guido (conseiller) et EducMaster restent non configurés : l'API répond 503 sur ces
      # routes, ce qui est le comportement voulu en démo. Ajouter les variables dans le
      # tableau de bord Render le jour où un vrai endpoint est disponible.
      - key: GUIDO_ALLOW_INSECURE_HTTP
        value: "true"
