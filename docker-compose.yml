services:
  postgres:
    image: postgres:16-alpine
    container_name: mo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mon_orientation
      POSTGRES_USER: mo_user
      POSTGRES_PASSWORD: mo_password
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mo_user -d mon_orientation']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
